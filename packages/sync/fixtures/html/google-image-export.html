<html>
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
  </head>
  <body class="c2 doc-content">
    <!--
      As Google's HTML export writes an image: the Description in the Alt text
      dialog as alt, its Title as title, each empty when left blank.
    -->
    <p class="c1"><span class="c0">Synthetic image export</span></p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          margin: 0px 0px;
          border: 0px solid #000000;
          transform: rotate(0rad) translateZ(0px);
          -webkit-transform: rotate(0rad) translateZ(0px);
          width: 624px;
          height: 312px;
        "
        ><img
          alt="Synthetic chart, described"
          src="images/image1.png"
          style="
            width: 624px;
            height: 312px;
            margin-left: 0px;
            margin-top: 0px;
            transform: rotate(0rad) translateZ(0px);
            -webkit-transform: rotate(0rad) translateZ(0px);
          "
          title="Synthetic title"
      /></span>
    </p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 312px;
          height: 156px;
        "
        ><img
          alt=""
          src="images/image1.png"
          style="width: 312px; height: 156px"
          title="Synthetic title only"
      /></span>
    </p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 312px;
          height: 156px;
        "
        ><img
          alt=""
          src="images/image1.png"
          style="width: 312px; height: 156px"
          title=""
      /></span>
    </p>
    <table>
      <tr>
        <td>
          <p class="c1">
            <span><img alt="" src="images/image1.png" title="  " /></span>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
