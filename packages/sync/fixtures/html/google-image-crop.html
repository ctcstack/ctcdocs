<html>
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
  </head>
  <body class="c2 doc-content">
    <!--
      As Google's HTML export crops an image: the file is whole, and a frame
      with overflow hidden shows part of it, the image drawn larger than the
      frame or moved by a negative margin.
    -->
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 624px;
          height: 333.33px;
        "
        ><img
          alt="Uncropped"
          src="images/image1.png"
          style="
            width: 624px;
            height: 333.33px;
            margin-left: 0px;
            margin-top: 0px;
          "
          title=""
      /></span>
    </p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 427px;
          height: 258px;
        "
        ><img
          alt="Cropped at the right and the bottom"
          src="images/image1.png"
          style="width: 624px; height: 333px; margin-left: 0px; margin-top: 0px"
          title=""
      /></span>
    </p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 230px;
          height: 1206px;
        "
        ><img
          alt="Cropped at the top"
          src="images/image1.png"
          style="
            width: 230px;
            height: 2048px;
            margin-left: 0px;
            margin-top: -842px;
          "
          title=""
      /></span>
    </p>
    <p class="c1"><img alt="Not framed" src="images/image1.png" /></p>
    <!-- A crop framed around a link: the same crop, found through the link. -->
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 427px;
          height: 258px;
        "
        ><a href="https://example.invalid/linked"
          ><img
            alt="Cropped and linked"
            src="images/image1.png"
            style="
              width: 624px;
              height: 333px;
              margin-left: 0px;
              margin-top: 0px;
            "
            title="" /></a
      ></span>
    </p>
    <!-- A frame whose sizes are not in pixels: the site cannot tell. -->
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 300pt;
          height: 200pt;
        "
        ><img
          alt="Framed in points"
          src="images/image1.png"
          style="width: 468pt; height: 250pt; margin-left: 0pt; margin-top: 0pt"
          title=""
      /></span>
    </p>
    <!--
      Crops the site cannot apply to the file: one also rotated, one not a PNG.
    -->
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          transform: rotate(0.5rad) translateZ(0px);
          width: 427px;
          height: 258px;
        "
        ><img
          alt="Cropped and rotated"
          src="images/image1.png"
          style="
            width: 624px;
            height: 333px;
            margin-left: 0px;
            margin-top: 0px;
            transform: rotate(0.5rad) translateZ(0px);
          "
          title=""
      /></span>
    </p>
    <p class="c1">
      <span
        style="
          overflow: hidden;
          display: inline-block;
          width: 427px;
          height: 258px;
        "
        ><img
          alt="Cropped GIF"
          src="images/image2.gif"
          style="width: 624px; height: 333px; margin-left: 0px; margin-top: 0px"
          title=""
      /></span>
    </p>
  </body>
</html>
