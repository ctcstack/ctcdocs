name: CTCDocs project rollback

# Restores a known-good Cloudflare Worker version. The caller exposes it as a
# manual workflow and passes the version to restore:
#
#     jobs:
#       rollback:
#         uses: ctcstack/ctcdocs/.github/workflows/project-rollback.yml@<commit sha>
#         with:
#           version_id: ${{ inputs.version_id }}
#           confirmation: ${{ inputs.confirmation }}
#           restore_older_secrets: ${{ inputs.restore_older_secrets }}
#           wrangler_environment: production
#           deploy_environment: production-deploy
#           smoke_environment: production-smoke
#         secrets: inherit

on:
  workflow_call:
    inputs:
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      confirmation:
        description: Must be the literal ROLLBACK
        required: true
        type: string
      wrangler_environment:
        required: true
        type: string
      deploy_environment:
        required: true
        type: string
      smoke_environment:
        required: true
        type: string
      restore_older_secrets:
        description: Restore a version whose Worker secrets were rotated since, bringing the old secrets back
        required: false
        type: boolean
        default: false
      branch:
        description: Branch holding the tooling the rollback runs from
        required: false
        type: string
        default: main
      pnpm_version:
        required: false
        type: string
        default: 11.9.0

permissions:
  contents: read

jobs:
  access-preflight:
    name: Verify the boundary before rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.smoke_environment }}

    steps:
      - name: Checkout tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      # The store is cached by this workflow rather than by setup-node. Its
      # cache key names only the lockfile, and a job that restores the cache
      # without installing, like the dependency audit, saves the near-empty
      # store it started from under that key first; every later job then
      # restored nothing and downloaded every package. The pnpm cache
      # directory is kept too: it records that this lockfile already passed
      # the supply-chain policy check, which otherwise repeats on every run.
      # Only a successful job saves, and pnpm checks what it links from the
      # store against the hashes it recorded for each package.
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/pnpm
          key: ctcdocs-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pnpm_version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify anonymous denial and machine-key admission
        env:
          CTCDOCS_BASE_URL: ${{ vars.CTCDOCS_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CTCDOCS_MACHINE_KEY: ${{ secrets.CTCDOCS_MACHINE_KEY }}
        run: pnpm exec ctcdocs-access-smoke --preflight

  rollback:
    name: Restore a known-good Worker version
    needs: access-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.deploy_environment }}
      url: ${{ steps.target.outputs.url }}

    steps:
      # A rollback is typed by a human under pressure. Both the confirmation and
      # the shape of the version identifier are checked before anything runs.
      - name: Validate rollback confirmation
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "${ROLLBACK_CONFIRMATION}" != "ROLLBACK" ]]; then
            echo "::error::Rollback confirmation did not match ROLLBACK."
            exit 1
          fi
          if [[ ! "${VERSION_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Cloudflare Worker version ID is invalid."
            exit 1
          fi

      - name: Checkout tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Resolve the configured deployment target
        id: target
        shell: bash
        env:
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
        run: |
          set -euo pipefail

          {
            echo "worker=$(jq -er '.deployment.workerName' site.config.json)"
            echo "url=$(jq -er --arg env "${WRANGLER_ENVIRONMENT}" '.deployment.environments[$env].url' site.config.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      # Cached by this workflow; the first job's store step explains why.
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/pnpm
          key: ctcdocs-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pnpm_version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Every version from before the platform's Worker serves the site with
      # no gate of its own. Without Access in front, restoring one would
      # publish the whole corpus, so a private deployment restores only
      # versions that carry the gate's mark (ADR-038).
      - name: Refuse a version without the gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(jq -r '[.deployment.environments[] | .visibility // "private"] | any(. == "private")' site.config.json)" != "true" ]]; then
            exit 0
          fi
          tag="$(pnpm exec wrangler versions view "${VERSION_ID}" --env "${WRANGLER_ENVIRONMENT}" --json | jq -r '.annotations["workers/tag"] // ""')"
          if [[ "${tag}" != "ctcdocs-gate-v1" ]]; then
            echo "::error::Version ${VERSION_ID} does not carry the gate's mark (tag '${tag}'); restoring it could publish the site without sign-in."
            exit 1
          fi

      # A version carries the secrets it was deployed with, and a rollback
      # brings them back: a rotated session secret would revive the sessions
      # its rotation ended. Unless the caller says so, a version older than a
      # secret change is refused, and so is one older than the versions
      # Wrangler lists, since nothing then shows what changed after it.
      - name: Refuse to restore rotated secrets unless asked
        if: ${{ !inputs.restore_older_secrets }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
        shell: bash
        run: |
          set -euo pipefail
          created="$(pnpm exec wrangler versions view "${VERSION_ID}" --env "${WRANGLER_ENVIRONMENT}" --json | jq -er '.metadata.created_on')"
          listed="$(pnpm exec wrangler versions list --env "${WRANGLER_ENVIRONMENT}" --json)"
          oldest="$(jq -er 'map(.metadata.created_on) | min' <<< "${listed}")"
          changes="$(jq -er --arg since "${created}" '[.[] | select(.metadata.created_on > $since and .annotations["workers/triggered_by"] == "secret")] | length' <<< "${listed}")"
          if [[ "${changes}" != "0" ]]; then
            echo "::error::Worker secrets changed after version ${VERSION_ID}; restoring it brings the old ones back. Run again with restore_older_secrets if that is intended."
            exit 1
          fi
          if [[ "${oldest}" > "${created}" ]]; then
            echo "::error::Version ${VERSION_ID} is older than the versions Wrangler lists, so a secret change after it cannot be ruled out. Run again with restore_older_secrets if that is intended."
            exit 1
          fi

      - name: Roll back to the approved version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
        run: >-
          pnpm exec wrangler rollback "${VERSION_ID}"
          --env "${WRANGLER_ENVIRONMENT}" --yes
          --message "GitHub Actions rollback run ${GITHUB_RUN_ID}"

      - name: Record rollback metadata
        env:
          VERSION_ID: ${{ inputs.version_id }}
          SITE_URL: ${{ steps.target.outputs.url }}
          WORKER_NAME: ${{ steps.target.outputs.worker }}
          WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
        run: |
          {
            echo "## Rollback"
            echo
            echo "- Worker: \`${WORKER_NAME}-${WRANGLER_ENVIRONMENT}\`"
            echo "- Restored Worker version: \`${VERSION_ID}\`"
            echo "- Hostname: ${SITE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  smoke:
    name: Verify the protected surface after rollback
    needs: rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.smoke_environment }}

    steps:
      - name: Checkout tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      # Cached by this workflow; the first job's store step explains why.
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/pnpm
          key: ctcdocs-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pnpm_version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the protected surface
        env:
          CTCDOCS_BASE_URL: ${{ vars.CTCDOCS_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CTCDOCS_MACHINE_KEY: ${{ secrets.CTCDOCS_MACHINE_KEY }}
        run: pnpm exec ctcdocs-access-smoke --post-deploy
