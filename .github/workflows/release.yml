name: Publish packages

# Publishing is off until the npm scope exists. Projects consume the packages as
# Git dependencies pinned to a commit until then (see README), so this workflow
# is written, reviewed and inert rather than absent: turning it on is setting
# the NPM_PUBLISHING repository variable to `true` and pushing a tag.
#
# It publishes with provenance through npm Trusted Publishing, so no long-lived
# publish token is stored anywhere.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish under
        required: false
        type: string
        default: latest

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: vars.NPM_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      # No dependency cache is restored here, so there is nothing another
      # workflow could have poisoned; dependencies come from the frozen
      # lockfile and the gate runs before anything is published.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Playwright belongs to the fixture project, the way it belongs to a real
      # one, so the browser is installed from there rather than from the root.
      - name: Install Chromium for the browser suite
        run: pnpm --filter ctcdocs-fixture-project exec playwright install --with-deps chromium

      # Nothing is published that the gate has not passed.
      - name: Run the canonical verification gate
        run: pnpm verify

      # A tag says which version is being released; the manifests say which
      # version exists. When they disagree the tag is wrong, and finding that
      # out after publishing is not a recoverable mistake.
      - name: Require the tag to match the packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          expected="${RELEASE_TAG#v}"
          for package in packages/core packages/sync packages/astro
          do
            version="$(jq -er '.version' "${package}/package.json")"
            if [[ "${version}" != "${expected}" ]]; then
              echo "::error::${package} is at ${version}, but the tag says ${expected}."
              exit 1
            fi
          done
          echo "Releasing ${expected}."

      # Two ways in, and the run says which one it took. The first release of a
      # package name cannot use trusted publishing, because the trusted
      # publisher is configured on a package that does not exist yet; every
      # release after it should, and then the token can be revoked.
      - name: Choose how this run authenticates
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "${NPM_TOKEN}" ]]; then
            echo "::notice::Publishing with the npm token from this environment."
          else
            # `setup-node` wrote an npmrc that expects a token. Left in place
            # with nothing to fill it, it fails the request before trusted
            # publishing is ever attempted.
            rm -f "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
            echo "::notice::No npm token in this environment; publishing through trusted publishing."
          fi

      # Order matters: the site package and the pipeline both depend on core,
      # and pnpm replaces the workspace protocol with the version it finds in
      # the registry at pack time.
      - name: Publish
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for package in packages/core packages/sync packages/astro
          do
            pnpm --dir "${package}" publish \
              --access public \
              --provenance \
              --tag "${DIST_TAG}" \
              --no-git-checks
          done
