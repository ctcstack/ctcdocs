name: Publish packages

# A release is a tag whose name matches the version in every package manifest,
# pushed while the NPM_PUBLISHING repository variable is `true`.
#
# Every package is published with provenance, so a consumer can check which
# commit and which workflow run produced the tarball they installed.
#
# Authentication has two modes, and a run says which one it took. Trusted
# publishing is the intended one and stores no credential anywhere, but it
# cannot perform the first release of a name: the trusted publisher is
# configured on a package, and the package does not exist yet. That release
# needs an npm token with `Bypass two-factor authentication` enabled — a
# runner cannot answer a one-time-password prompt — and the token should be
# revoked once trusted publishing is configured on all three packages.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish under
        required: false
        type: string
        default: latest

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: vars.NPM_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      # No dependency cache is restored here, so there is nothing another
      # workflow could have poisoned; dependencies come from the frozen
      # lockfile and the gate runs before anything is published.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      # Two ways in, and the run says which one it took. The first release of a
      # package name cannot use trusted publishing, because the trusted
      # publisher is configured on a package that does not exist yet; every
      # release after it should, and then the token can be revoked.
      #
      # This runs before anything installs, because `setup-node` writes an
      # npmrc referring to a token that is only set for the publish step, and
      # every pnpm command in between otherwise reports failing to expand it.
      - name: Choose how this run authenticates
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "${NPM_TOKEN}" ]]; then
            echo "::notice::Publishing with the npm token from this environment."
          else
            # Left in place with nothing to fill it, that npmrc fails the
            # request before trusted publishing is ever attempted.
            rm -f "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
            echo "::notice::No npm token in this environment; publishing through trusted publishing."
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Playwright belongs to the fixture project, the way it belongs to a real
      # one, so the browser is installed from there rather than from the root.
      - name: Install Chromium for the browser suite
        run: pnpm --filter ctcdocs-fixture-project exec playwright install --with-deps chromium

      # Nothing is published that the gate has not passed.
      - name: Run the canonical verification gate
        run: pnpm verify

      # A tag says which version is being released; the manifests say which
      # version exists. When they disagree the tag is wrong, and finding that
      # out after publishing is not a recoverable mistake.
      - name: Require the tag to match the packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          expected="${RELEASE_TAG#v}"
          for package in packages/core packages/sync packages/astro
          do
            version="$(jq -er '.version' "${package}/package.json")"
            if [[ "${version}" != "${expected}" ]]; then
              echo "::error::${package} is at ${version}, but the tag says ${expected}."
              exit 1
            fi
          done

          # A version nobody described is a version nobody can decide whether to
          # take, and this is the last moment the omission is cheap to fix.
          if ! grep -qxF "## ${expected}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${expected}' section."
            exit 1
          fi

          echo "Releasing ${expected}."

      # Order matters: the site package and the pipeline both depend on core,
      # and pnpm replaces the workspace protocol with the version it finds in
      # the registry at pack time.
      #
      # Three publishes are three chances to fail halfway, and a version cannot
      # be published twice. Skipping what the registry already has makes the
      # step restartable, so a failure on the last package is retried rather
      # than worked around by hand.
      - name: Publish
        shell: bash
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for package in packages/core packages/sync packages/astro
          do
            name="$(jq -er '.name' "${package}/package.json")"
            version="$(jq -er '.version' "${package}/package.json")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already published; skipping it."
              continue
            fi

            pnpm --dir "${package}" publish \
              --access public \
              --provenance \
              --tag "${DIST_TAG}" \
              --no-git-checks
          done
