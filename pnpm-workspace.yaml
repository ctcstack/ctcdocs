packages:
  - packages/*
  - fixtures/project

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260730.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260730.1'
  - '@cloudflare/workerd-linux-64@1.20260730.1'
  - '@cloudflare/workerd-linux-arm64@1.20260730.1'
  - '@cloudflare/workerd-windows-64@1.20260730.1'
  - '@playwright/test@1.62.1'
  - miniflare@4.20260730.0
  - playwright-core@1.62.1
  - playwright@1.62.1
  - workerd@1.20260730.1
  - wrangler@4.116.0

overrides:
  # Miniflare pins `undici` to exactly 7.29.0, which GHSA-3wwx-pv8p-q78v
  # reports (moderate), in every `wrangler` up to 4.143.0. It reaches only the
  # fixture project's tooling, and 7.29.1 is the fix on the same line. The key
  # names the pinned version, so the override stops applying once Miniflare
  # pins another; drop it then.
  'miniflare>undici@7.29.0': 7.29.1
  # Miniflare pins `sharp` to exactly 0.35.4, whose bundled librsvg
  # GHSA-wq5f-xc86-pv6w reports (high). Miniflare loads it only for the
  # fixture project's local image service; 0.35.5 is the fix on the same line.
  # Drop this once Miniflare pins another.
  'miniflare>sharp@0.35.4': 0.35.5
  # source-map-js before 1.2.2 can be made to loop on crafted section offsets,
  # GHSA-68fv-2mgg-jv7q (high). It reaches PostCSS and Vite in the build and
  # test tooling, which read only this repository's own source maps.
  'source-map-js@<1.2.2': 1.2.2

auditConfig:
  ignoreGhsas:
    # http-cache-semantics through 4.2.0 can let a shared cache hand one
    # user's response to another (high). It reaches only Astro's build-time
    # cache of remote images, `astro/dist/assets/build/remote.js`, which one
    # build process reads alone: there is no shared cache and no second user.
    # No patched version is published; drop this once one is and the lockfile
    # takes it.
    - GHSA-ch52-4w7c-c8xp
